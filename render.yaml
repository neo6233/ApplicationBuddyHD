services:
  - type: web
    name: aria-backend
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: OLLAMA_BASE_URL
        value: http://127.0.0.1:11434
      - key: OLLAMA_MODEL
        value: gemma3:4b
      - key: OLLAMA_TIMEOUT_MS
        value: 30000
      - key: CORS_ORIGIN
        sync: false
